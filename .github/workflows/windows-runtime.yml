name: Windows runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check repository consistency
        shell: powershell
        run: ./tasks/Test-RepositoryConsistency.ps1
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Qualify worktree-scoped development recovery
        shell: powershell
        run: ./tasks/Test-DevContext.ps1 -Executable ./target/release/reflexcore.exe
      - name: Check registry build provenance over MCP
        shell: powershell
        run: |
          try {
            ./tasks/Test-DevRegistry.ps1
            ./tasks/Test-DevBuildIsolation.ps1
            ./tasks/Test-DevResume.ps1
            ./tasks/Test-HookIngress.ps1
            ./tasks/Test-ManagedEvents.ps1
            ./tasks/Test-DevGuard.ps1
            ./tasks/Test-EngineeringMemory.ps1
            ./tasks/Test-RepositoryKnowledge.ps1
          } catch {
            Write-Host ("::error::{0} (line {1})" -f $_.Exception.Message,$_.InvocationInfo.ScriptLineNumber)
            throw
          }
      - name: Check fixture and report correlation
        shell: powershell
        run: |
          ./tools/Run-ReflexBenchmark.ps1 -SelfTest
          ./tools/ReflexCore-VisionLoop.ps1 -Action SelfTest
          foreach ($name in 'Measure-NativeSession','Compare-NativeSession','Test-NativeSession','Measure-SkillTransfer') {
            $errors = $null
            $tokens = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./tools/$name.ps1").Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw $errors[0] }
          }
      - name: Validate editor bindings without opening a window
        shell: powershell
        run: |
          $exe = './target/release/reflexcore.exe'
          $id = 'artifact.verify_saved_text'
          $result = & $exe learning bind $id 1 winforms background | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.binding.contract_version -ne 1 -or !$result.binding.background) { throw 'Invalid WinForms binding' }
          $result = & $exe learning bind $id 1 notepad foreground | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.binding.adapter -ne 'notepad' -or $result.binding.background) { throw 'Invalid Notepad binding' }
      - name: Reject invalid discovery descriptors without opening a window
        shell: powershell
        run: ./tasks/Test-SkillDiscovery.ps1
      - name: Compile and check Studio
        # The visible fixture and its in-flight fault tests need an unlocked desktop.
        shell: powershell
        run: ./tools/ReflexCore-ControlCenter.ps1 -SelfTest
      - name: Check queue recovery and editor receipt decisions
        shell: powershell
        run: ./tasks/Test-Queue.ps1
